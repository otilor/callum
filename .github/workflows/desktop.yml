# The desktop app: tested on every push, and built for macOS (Apple Silicon and Intel), Windows and Linux when a
# version tag (v*) is pushed. The Release workflow (release.yml) does the same from a button, without a tag push.
# Kept apart from ci.yml so the two can change without touching each other.
name: Desktop

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop app on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and compile the server and the desktop shell
        run: npm run desktop:prepare
      - name: Start the real app and check it
        run: xvfb-run -a npm run e2e:desktop
        env:
          CI: "true"
      - name: Package the unpacked app
        run: npx electron-builder --dir
      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: test-results-desktop

  # The release is made once, here; the installers below only add their files to it.
  release:
    name: Create the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  installers:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/installers.yml
    with:
      tag: ${{ github.ref_name }}
