<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>%%name%% | LinkedIn</title></head>
<body data-slug="%%slug%%" data-name="%%name%%" data-limit="%%limit%%">
  <header class="global-nav"><a href="/feed/" aria-label="Home">Home</a></header>
  <main>
    <section class="artdeco-card pv-top-card">
      <h1 class="text-heading-xlarge">%%name%%</h1>
      <div class="text-body-medium break-words">%%headline%%</div>
      <div class="pvs-profile-actions">
%%actions%%
      </div>
    </section>
    <section class="artdeco-card"><h2>About</h2><p>Connections: 500+ connections</p></section>
    <aside>
      <section class="artdeco-card">
        <h2>People also viewed</h2>
        <ul>
          <li>
            <a href="/in/decoy/">Zed Decoy</a>
            <button class="artdeco-button" aria-label="Invite Zed Decoy to connect" data-action="connect" data-slug="decoy" data-name="Zed Decoy"><span class="artdeco-button__text">Connect</span></button>
          </li>
          <li>
            <a href="/in/decoy-two/">Yan Decoy</a>
            <button class="artdeco-button" aria-label="Message Yan" data-action="message" data-slug="decoy-two" data-name="Yan Decoy"><span class="artdeco-button__text">Message</span></button>
          </li>
        </ul>
      </section>
    </aside>
  </main>
  <div id="dialog-root"></div>
  <div id="msg-root"></div>
  <script src="/site.js"></script>
</body></html>
