# Callum as a small server. Copy .env.example to .env, set CALLUM_PASSWORD, then run:
#   docker compose up -d
# and open http://localhost:4600. Your data lives in the callum-data volume.
services:
  callum:
    build: .
    restart: unless-stopped
    ports:
      - "${CALLUM_PORT:-4600}:4600"
    environment:
      # Required. Callum listens on every interface in a container, so it asks for this password first.
      CALLUM_PASSWORD: ${CALLUM_PASSWORD:?Set CALLUM_PASSWORD in .env before you start Callum}
      # Claude Code isn't in the container, so Claude runs here with an API key (see docs/SETUP.md#claude).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CALLUM_MODEL: ${CALLUM_MODEL:-}
      CALLUM_MICROSOFT_CLIENT_ID: ${CALLUM_MICROSOFT_CLIENT_ID:-}
      TZ_DEFAULT: ${TZ_DEFAULT:-}
      # Set to 1 when an HTTPS reverse proxy sits in front of Callum (see the README).
      CALLUM_TRUST_PROXY: ${CALLUM_TRUST_PROXY:-}
    volumes:
      - callum-data:/data

volumes:
  callum-data:
